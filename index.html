<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ziya 1st Birthday - 1200x630 OG Image</title>
  
  <!-- Playful Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Grandstander:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Grandstander', 'sans-serif'],
            sans: ['Fredoka', 'sans-serif'],
          },
          colors: {
            'party-pink': '#ff3b75',
            'party-yellow': '#ffc300',
            'party-blue': '#00bbf9',
            'party-purple': '#9b5de5',
            'party-green': '#00f5d4',
            'party-orange': '#ff6b35',
          },
        },
      },
    }
  </script>

  <style>
    .og-container {
      width: 1200px;
      height: 630px;
      background-color: #fffdf0;
      background-image: 
        radial-gradient(#ff3b75 4px, transparent 4px),
        radial-gradient(#00bbf9 4px, transparent 4px),
        radial-gradient(#ffc300 4px, transparent 4px),
        radial-gradient(#9b5de5 4px, transparent 4px);
      background-size: 60px 60px, 70px 70px, 50px 50px, 80px 80px;
      background-position: 0 0, 35px 35px, 20px 20px, 40px 40px;
    }

    .rainbow-card {
      background: #ffffff;
      border-radius: 44px;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(255, 59, 117, 0.3);
    }

    .rainbow-card::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 52px;
      background: linear-gradient(135deg, #ff3b75, #ffc300, #00f5d4, #00bbf9, #9b5de5);
      z-index: -1;
    }
  </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">

  <div class="og-container relative overflow-hidden flex flex-col justify-between p-8 font-sans select-none shrink-0">

    <!-- Top Banner -->
    <div class="absolute top-0 left-0 right-0 w-full overflow-hidden leading-none z-10">
      <svg class="w-full h-16" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <polygon points="0,0 60,95 120,0" fill="#ff3b75"/>
        <polygon points="120,0 180,95 240,0" fill="#ffc300"/>
        <polygon points="240,0 300,95 360,0" fill="#00bbf9"/>
        <polygon points="360,0 420,95 480,0" fill="#00f5d4"/>
        <polygon points="480,0 540,95 600,0" fill="#9b5de5"/>
        <polygon points="600,0 660,95 720,0" fill="#ff6b35"/>
        <polygon points="720,0 780,95 840,0" fill="#ff3b75"/>
        <polygon points="840,0 900,95 960,0" fill="#ffc300"/>
        <polygon points="960,0 1020,95 1080,0" fill="#00bbf9"/>
        <polygon points="1080,0 1140,95 1200,0" fill="#00f5d4"/>

    </div>

    <!-- Background Emojis -->
    <div class="absolute top-20 left-10 text-5xl">🎁</div>
    <div class="absolute top-20 right-10 text-5xl">🎂</div>
    <div class="absolute bottom-8 left-12 text-5xl">✨</div>
    <div class="absolute bottom-8 right-12 text-5xl">🎉</div>

    <!-- Main Card -->
    <div class="rainbow-card mt-6 p-6 flex flex-col justify-center items-center text-center relative z-20 h-full">

      <!-- 5-Balloon Cluster Graphic -->
      <div class="mb-1">
        <svg class="w-56 h-36" viewBox="0 0 200 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Strings -->
          <path d="M100 85 Q 95 110 90 135" stroke="#ff3b75" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M72 75 Q 80 105 85 135" stroke="#00bbf9" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M128 75 Q 120 105 115 135" stroke="#9b5de5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M45 80 Q 65 110 82 135" stroke="#00f5d4" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M155 80 Q 135 110 118 135" stroke="#ffc300" stroke-width="2" stroke-linecap="round" fill="none"/>

          <!-- Far Left Balloon (Green) -->
          <ellipse cx="38" cy="58" rx="18" ry="23" fill="#00f5d4"/>
          <ellipse cx="33" cy="50" rx="5" ry="8" fill="#ffffff" opacity="0.5"/>
          <polygon points="38,81 34,86 42,86" fill="#00f5d4"/>

          <!-- Far Right Balloon (Yellow) -->
          <ellipse cx="162" cy="58" rx="18" ry="23" fill="#ffc300"/>
          <ellipse cx="157" cy="50" rx="5" ry="8" fill="#ffffff" opacity="0.5"/>
          <polygon points="162,81 158,86 166,86" fill="#ffc300"/>

          <!-- Mid Left Balloon (Blue) -->
          <ellipse cx="70" cy="50" rx="21" ry="26" fill="#00bbf9"/>
          <ellipse cx="64" cy="40" rx="6" ry="9" fill="#ffffff" opacity="0.5"/>

          <ellipse cx="124" cy="40" rx="6" ry="9" fill="#ffffff" opacity="0.5"/>
          <polygon points="130,76 126,81 134,81" fill="#9b5de5"/>

          <!-- Center Top Balloon (Pink) -->
          <ellipse cx="100" cy="40" rx="25" ry="31" fill="#ff3b75"/>
          <ellipse cx="92" cy="28" rx="7" ry="11" fill="#ffffff" opacity="0.6"/>
          <polygon points="100,71 95,77 105,77" fill="#ff3b75"/>

          <!-- Bow -->
          <circle cx="100" cy="135" r="5" fill="#ffc300"/>
        </svg>
      </div>

      <!-- Tagline Pill -->
      <div class="inline-block bg-gradient-to-r from-party-yellow via-party-orange to-party-pink px-8 py-1.5 rounded-full mb-2 shadow-md transform -rotate-1">
        <span class="font-display font-black text-base text-white tracking-wide uppercase drop-shadow-sm">
          🎈 You're Invited to Ziya's Party! 🎉
        </span>
      </div>

      <!-- Main Headline with Graphic "1" -->
      <div class="flex items-center justify-center gap-3 my-1">
        <h1 class="font-display text-5xl font-black text-party-pink leading-none tracking-tight">
          Ziya is Turning
        </h1>

        <!-- Cute 3D Graphic "1" with Party Hat -->
        <div class="relative inline-block ml-1">
          <svg class="w-20 h-24 overflow-visible" viewBox="0 0 70 90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Party Hat on Top of 1 -->
            <polygon points="38,0 20,28 52,24" fill="#ffc300"/>
            <circle cx="38" cy="0" r="4" fill="#ff3b75"/>
            <path d="M22 23 L48 20" stroke="#00bbf9" stroke-width="2.5" stroke-dasharray="3 3"/>

            <!-- Cute Bubble "1" Body -->
            <path d="M28 32 L38 25 C42 22 48 25 48 30 L48 80 C48 84 44 88 38 88 L28 88 C22 88 18 84 18 80 L18 78 L32 78 L32 40 L24 45 C20 48 15 45 15 40 C15 36 20 33 28 32 Z" fill="#9b5de5"/>
            <!-- Inner Highlight -->
            <path d="M34 38 L34 76" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
          </svg>
        </div>
      </div>

      <p class="text-gray-700 font-bold text-xl mt-1">
        One year of sweet smiles & tiny steps! Join us for cake, playtime & fun! 🧁
      </p>

      <!-- Event Details Bar -->
      <div class="mt-5 flex items-center justify-center gap-6 w-full max-w-2xl">
        <div class="flex-1 bg-amber-100/90 border-3 border-party-yellow p-3 rounded-2xl flex items-center gap-4 shadow-sm">
          <div class="w-12 h-12 rounded-xl bg-party-yellow text-gray-900 flex flex-col items-center justify-center shrink-0 border border-white">
            <span class="text-[9px] font-black uppercase text-party-orange leading-none">AUG</span>
            <span class="font-display text-xl font-black leading-none mt-0.5">29</span>
          </div>
          <div class="text-left">
            <p class="font-display font-extrabold text-party-orange text-lg leading-tight">Sat, August 29, 2026</p>
            <p class="text-xs font-bold text-gray-600">4:00 PM Onwards</p>
          </div>
        </div>

        <div class="flex-1 bg-cyan-100/90 border-3 border-party-blue p-3 rounded-2xl flex items-center gap-4 shadow-sm">
          <div class="w-12 h-12 rounded-xl bg-party-blue text-white flex items-center justify-center text-xl shrink-0 border border-white">
            📍
          </div>
          <div class="text-left">
            <p class="font-display font-extrabold text-party-blue text-lg leading-tight">704 Spring St</p>
            <p class="text-xs font-bold text-gray-600">Seattle, WA 98104</p>
          </div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
