<script>
    const form = document.getElementById('rsvpForm');
    const thankYouMsg = document.getElementById('thankYouMsg');
    
    // Paste your Web App URL here
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzcCksKC6Ej3k1EYri8M-bFXJzlbCU10X-Rc-AgzqbRT0uPProMT_xt0Y_uTHU7B_FV/exec';

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      // Trigger Confetti
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#fde2e4', '#cddaff', '#fff1e6', '#f0a6ca', '#e3b567']
      });

      // Format form data as JSON
      const data = {
        guest_name: form.guest_name.value,
        attendance: form.attendance.value,
        guest_count: form.guest_count.value,
        message: form.message.value
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Bypasses CORS restriction for Apps Script
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        // Show thank you message
        form.reset();
        form.classList.add('hidden');
        thankYouMsg.classList.remove('hidden');
      } catch (err) {
        alert("Something went wrong. Please try again!");
      }
    });
  </script>
